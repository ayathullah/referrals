<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Referral Links</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-200 py-6 px-4 sm:px-6 shadow-xs">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="text-3xl font-bold tracking-tight text-gray-900">Recommended Deals & Offers</h1>
            <p class="mt-2 text-sm text-gray-600">Browse my favorite services and grab your sign-up bonuses!</p>
        </div>
    </header>

    <main class="max-w-4xl w-full mx-auto px-4 sm:px-6 py-8 grow">
        <div id="category-filters" class="flex flex-wrap justify-center gap-2 mb-8">
            <button onclick="filterCategory('All', this)" class="category-btn px-4 py-2 rounded-full text-sm font-medium bg-gray-900 text-white transition-all shadow-xs cursor-pointer">All</button>
            <button onclick="filterCategory('Energy', this)" class="category-btn px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:bg-gray-100 transition-all cursor-pointer">Energy</button>
            <button onclick="filterCategory('Cashback', this)" class="category-btn px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:bg-gray-100 transition-all cursor-pointer">Cashback</button>
            <button onclick="filterCategory('Banking', this)" class="category-btn px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:bg-gray-100 transition-all cursor-pointer">Banking</button>
        </div>

        <div id="cards-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Cards load dynamically here -->
        </div>
    </main>

    <footer class="py-6 text-center text-xs text-gray-400 border-t border-gray-200 bg-white">
        <p>&copy; 2026 Referral Directory. All rights reserved.</p>
    </footer>

    <script>
        let allLinks = [];

        async function loadLinks() {
            try {
                const response = await fetch('links.json');
                allLinks = await response.json();
                renderCards(allLinks);
            } catch (error) {
                console.error('Error loading links:', error);
            }
        }

        function renderCards(links) {
            const grid = document.getElementById('cards-grid');
            grid.innerHTML = '';
            
            links.forEach(item => {
                const badgeColor = item.category === 'Energy' ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700';
                
                const card = document.createElement('div');
                card.className = 'referral-card bg-white rounded-2xl border border-gray-200 p-5 shadow-xs flex flex-col justify-between transition-all hover:shadow-md';
                card.setAttribute('data-category', item.category);
                
                card.innerHTML = `
                    <div>
                        <div class="flex items-center space-x-3 mb-3">
                            <img src="${item.logo}" alt="${item.company} logo" class="w-10 h-10 rounded-lg p-1 bg-gray-50 border border-gray-100 object-contain">
                            <div>
                                <h2 class="font-semibold text-gray-900">${item.company}</h2>
                                <span class="inline-block px-2 py-0.5 text-xs font-medium ${badgeColor} rounded-md mt-0.5">${item.category}</span>
                            </div>
                        </div>
                        <p class="text-sm text-gray-600 mb-4">${item.offer}</p>
                    </div>
                    <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-xl text-center text-sm transition-colors flex items-center justify-center space-x-2">
                        <span>Get Deal</span>
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                    </a>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(category, btnElement) {
            const buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(btn => {
                btn.className = 'category-btn px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:bg-gray-100 transition-all cursor-pointer';
            });
            btnElement.className = 'category-btn px-4 py-2 rounded-full text-sm font-medium bg-gray-900 text-white transition-all shadow-xs cursor-pointer';

            if (category === 'All') {
                renderCards(allLinks);
            } else {
                const filtered = allLinks.filter(item => item.category === category);
                renderCards(filtered);
            }
        }

        loadLinks();
    </script>
</body>
</html>
